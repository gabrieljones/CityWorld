name: Record CityWorld Generation

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  record-server:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Build with Gradle
      run: ./gradlew build

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg xvfb mesa-utils

    - name: Setup Minecraft Server
      run: |
        mkdir server
        cd server

        # Download Paper 1.21.1
        # Fetch latest build info
        BUILD_ID=$(curl -s https://api.papermc.io/v2/projects/paper/versions/1.21.1/builds | jq -r '.builds[-1].build')
        JAR_NAME="paper-1.21.1-$BUILD_ID.jar"
        DOWNLOAD_URL="https://api.papermc.io/v2/projects/paper/versions/1.21.1/builds/$BUILD_ID/downloads/$JAR_NAME"

        echo "Downloading Paper build $BUILD_ID from $DOWNLOAD_URL"
        curl -o server.jar "$DOWNLOAD_URL"

        # Accept EULA
        echo "eula=true" > eula.txt

        # Configure Generator
        echo "settings:" > bukkit.yml
        echo "  allow-end: true" >> bukkit.yml
        echo "  allow-nether: true" >> bukkit.yml
        echo "worlds:" >> bukkit.yml
        echo "  world:" >> bukkit.yml
        echo "    generator: CityWorld" >> bukkit.yml

        # Prepare Plugins folder
        mkdir plugins
        cp ../build/libs/CityWorld-4.060.jar plugins/CityWorld.jar

    - name: Run Server and Record
      run: |
        cd server

        # Start Xvfb, ffmpeg, and Minecraft Server
        # We record for 60 seconds which should be enough to start and generate spawn

        xvfb-run --server-args="-screen 0 1280x720x24" sh -c '
          ffmpeg -f x11grab -video_size 1280x720 -i :99 -codec:v libx264 -r 30 -t 60 ../cityworld_generation.mp4 &
          PID_FFMPEG=$!

          # Run Server (GUI enabled by default without --nogui)
          # Use timeout to kill server after 60s
          timeout 60s java -Xms2G -Xmx2G -jar server.jar

          wait $PID_FFMPEG
        ' || true

    - name: Upload Recording
      uses: actions/upload-artifact@v4
      with:
        name: cityworld-recording
        path: cityworld_generation.mp4
